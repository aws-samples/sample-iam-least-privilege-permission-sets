[project]
name = "lp2ps"
version = "0.1.0"
description = "IAM Least-Privilege -> Permission Set Generator (read-only analysis + IaC)"
requires-python = ">=3.11"
license = { text = "MIT-0" }
dependencies = [
  "boto3>=1.34",
  "botocore>=1.34",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pyarrow>=15",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "moto>=5.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "python-hcl2>=4.3",
]

[project.scripts]
lp2ps = "lp2ps.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lp2ps*"]

[tool.setuptools.package-data]
lp2ps = ["iac_templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests"]
