[project]
name = "lp2ps-api"
version = "0.1.0"
description = "LP2PS backend API (FastAPI/Mangum) — read model over tool-owned S3/DynamoDB"
requires-python = ">=3.11"
license = { text = "MIT-0" }
dependencies = [
  "fastapi>=0.110",
  "mangum>=0.17",
  "boto3>=1.34",
  "pydantic>=2.6",
]
# 엔진 계약(models.py)·저장소(storage.py)를 재사용하므로 `lp2ps` 가 필요하다. 배포 시에도 함께
# 패키징한다. **의도적으로 dependencies 에 넣지 않는다** — `lp2ps` 는 공개 PyPI 에 없는 로컬
# 형제 패키지이므로, 이름으로 선언하면 pip 이 공개 인덱스에서 같은 이름을 찾아 설치할 수 있다
# (dependency confusion). 대신 engine 을 먼저 설치한다:
#     cd engine && pip install -e .
#     cd ../backend && pip install -e '.[dev]'
# CI 도 이 순서를 지킨다(.github/workflows/ci.yml). 설치 순서가 틀리면 import 시점에 바로
# 드러나므로(ModuleNotFoundError: lp2ps) 조용히 잘못된 패키지를 쓰는 것보다 안전하다.

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",       # FastAPI TestClient
  "moto>=5.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lp2ps_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests"]
